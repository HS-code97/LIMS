; 회사 Docker 컨테이너 1개 안에서 LIMS 상시 구동 (설계서 4.2·4.3절)
; 배치: 저장소 루트 = /opt/lims (가상환경 /opt/lims/.venv, 설정 /opt/lims/.env), 앱 패키지 = /opt/lims/lims/app
; %(ENV_…)s 값은 supervisord를 띄운 셸 환경에 있어야 합니다(.env를 export한 뒤 supervisord 실행).
; TZ=KST-9: 컨테이너 기본(UTC)이면 KST 00~09시 입력의 평가일·탑승일이 전날로 기록됩니다.
;           tzdata 없이도 되는 POSIX 표기입니다. PostgreSQL 쪽은 README의 timezone 설정 참조.
[program:lims]
directory=/opt/lims/lims
command=/opt/lims/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port %(ENV_LIMS_PORT)s --workers 2 --proxy-headers
; LIMS_SECRET_KEY가 supervisord 환경에 없으면 supervisord가 설정을 읽다 멈추고, 약하면 앱이 기동을 거부합니다.
environment=LIMS_DATABASE_URL="postgresql+psycopg://lims:%(ENV_LIMS_DB_PASSWORD)s@localhost:5432/lims",LIMS_FILES_DIR="/data/lims/files",LIMS_VAR_DIR="/data/lims/var",LIMS_SECRET_KEY="%(ENV_LIMS_SECRET_KEY)s",TZ="KST-9"
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/data/lims/log/lims.out.log
stderr_logfile=/data/lims/log/lims.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

; 장비 PC 공유 폴더 감시 (2단계). LIMS_WATCH_DIRS가 확보되면 autostart=true로 바꿉니다. 한 개만 띄웁니다.
[program:lims-watcher]
directory=/opt/lims/lims
command=/opt/lims/.venv/bin/python -m app.workers.watcher
environment=LIMS_DATABASE_URL="postgresql+psycopg://lims:%(ENV_LIMS_DB_PASSWORD)s@localhost:5432/lims",LIMS_FILES_DIR="/data/lims/files",LIMS_VAR_DIR="/data/lims/var",LIMS_WATCH_DIRS="%(ENV_LIMS_WATCH_DIRS)s",TZ="KST-9"
autostart=false
autorestart=true
numprocs=1
stdout_logfile=/data/lims/log/watcher.out.log
stderr_logfile=/data/lims/log/watcher.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
