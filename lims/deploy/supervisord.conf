; 회사 Docker 컨테이너 1개 안에서 LIMS 상시 구동 (설계서 4.2·4.3절)
[program:lims]
directory=/opt/lims
command=/opt/lims/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port %(ENV_LIMS_PORT)s --workers 2 --proxy-headers
environment=LIMS_DATABASE_URL="postgresql+psycopg://lims:%(ENV_LIMS_DB_PASSWORD)s@localhost:5432/lims",LIMS_FILES_DIR="/data/lims/files",LIMS_VAR_DIR="/data/lims/var"
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/data/lims/log/lims.out.log
stderr_logfile=/data/lims/log/lims.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; 장비 PC 공유 폴더 감시 (2단계). LIMS_WATCH_DIRS가 확보되면 autostart=true로 바꿉니다.
[program:lims-watcher]
directory=/opt/lims
command=/opt/lims/.venv/bin/python -m app.workers.watcher
environment=LIMS_DATABASE_URL="postgresql+psycopg://lims:%(ENV_LIMS_DB_PASSWORD)s@localhost:5432/lims",LIMS_FILES_DIR="/data/lims/files",LIMS_VAR_DIR="/data/lims/var",LIMS_WATCH_DIRS="%(ENV_LIMS_WATCH_DIRS)s"
autostart=false
autorestart=true
stdout_logfile=/data/lims/log/watcher.out.log
stderr_logfile=/data/lims/log/watcher.err.log
